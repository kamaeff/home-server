SecRule SERVER_NAME "^(drive|files)\.[a-z]+\.[a-z]+$" \
  "id:10001001,\
  phase:1,\
  nolog,\
  pass,\
  setvar:TX.is_copyparty=1"

# rule 932260 is triggered by copyparty `uname` argument during web auth
# here we disable that rule if args look like copyparty auth args
SecRule TX:is_copyparty "@eq 1" \
    "id:10001002, phase:2, nolog, chain"
    SecRule &ARGS_POST "@eq 4" "chain"
    SecRule ARGS_POST:act "@streq login" "chain"
    SecRule &ARGS_POST:uname "@eq 1" "chain"
    SecRule &ARGS_POST:cppwd "@eq 1" "chain"
    SecRule &ARGS_POST:uhash "@eq 1" \
        "pass, ctl:ruleRemoveById=932260"

# disable allowed methods check for webdav
SecRule TX:is_copyparty "@eq 1" \
    "id:10001003,\
    phase:1,\
    nolog,\
    pass,\
    ctl:ruleRemoveById=911100"