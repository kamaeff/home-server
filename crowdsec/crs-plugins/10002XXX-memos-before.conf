# allow application/proto content-type without content-length
SecRule SERVER_NAME "^memos\.[a-z]+\.[a-z]+$" \
  "id:10002001, phase:1, nolog, chain"
  SecRule REQUEST_METHOD "@streq POST" "chain"
  SecRule REQUEST_FILENAME "^/memos\.api\." "chain"
  SecRule REQUEST_HEADERS:Content-Type "@streq application/proto" \
  "pass, ctl:ruleRemoveById=920180, ctl:ruleRemoveById=920420"
