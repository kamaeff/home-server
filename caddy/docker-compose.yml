services:
  caddy:
    build: .
    container_name: caddy
    restart: always
    networks:
      cloudflared:
      crowdsec-front:

      vw:
      copyparty:
        aliases:
          # force collabora backend to connect to copyparty internally through caddy
          - drive.${SERVICE_DOMAIN:?}
          - files.${SERVICE_DOMAIN:?}
          - files.${PERSONAL_DOMAIN:?}
          # force copyparty backend to connect to collabora internally through caddy
          - office.${SERVICE_DOMAIN:?}
          - office-ext.${SERVICE_DOMAIN:?}
          - office.${PERSONAL_DOMAIN:?}
      navidrome:
      picard:
      immich-front:
      geopulse-front:
      hauk-front:
      linkwarden-front:
      slskd:
      transmission:
      aria2:
      pyload:
      metube:
      pihole:
      scrutiny:
      miniflux-front:
      memos:

      arpeggi-tmp-navidrome:

    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APP_DATA:?APP_DATA not set}/caddy/config:/config
      - ${APP_DATA:?APP_DATA not set}/caddy/data:/data
      - ${APP_DATA:?APP_DATA not set}/caddy/static:/static:ro
    environment:
        - SERVICE_DOMAIN=${SERVICE_DOMAIN:?SERVICE_DOMAIN not set}
        - PERSONAL_DOMAIN=${PERSONAL_DOMAIN:?}
    env_file: caddy.env

  caddy-build-static:
    profiles:
      - do-not-start
    image: alpine/git:latest
    container_name: caddy-build-static
    volumes:
      - ${APP_DATA:?APP_DATA not set}/caddy/static:/static
      - ./build-static.sh:/build-static.sh:ro
    tmpfs:
      - /tmp
    entrypoint: /bin/sh /build-static.sh
    restart: on-failure:3
